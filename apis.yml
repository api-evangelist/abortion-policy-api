description: >-
  The Abortion Policy API provides up-to-date information on US state abortion policies that can be integrated into
  online abortion resources. The API consolidates abortion laws into one database across four data tables covering
  gestational limits, insurance coverage, minors restrictions, and waiting periods. Data is accessible by US state name
  or zip code. The project is co-led by Patient Forward and is fiscally sponsored by NEO Philanthropy.
